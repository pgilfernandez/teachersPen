[package]
name = "teacherspen"
version = "1.0.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["Pablo Gil Fernández"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-shell = "=2.6.0"
tauri-plugin-single-instance = "=2.5.5"
tauri = { version = "=2.12.5", features = [ "macos-private-api", "image-png", "tray-icon"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
cocoa = "0.24"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
zbus = "=3.15.2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"
