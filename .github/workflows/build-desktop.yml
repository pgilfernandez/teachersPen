name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  macos:
    name: macOS ${{ matrix.arch }} · lightweight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            target: x86_64-apple-darwin
          - runner: macos-15
            arch: arm64
            target: aarch64-apple-darwin
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Get short commit ID
        id: commit
        shell: bash
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: tauri-${{ runner.os }}-${{ matrix.arch }}-rust191-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: tauri-${{ runner.os }}-${{ matrix.arch }}-rust191-
      - name: Install dependencies
        run: npm ci
      - name: Check dependency licenses
        run: npm run licenses:check
      - name: Build DMG for this architecture only
        run: npm run dist:mac -- --target ${{ matrix.target }} --ci
      - name: Verify macOS packaged licenses and sources
        run: npm run licenses:verify -- --app src-tauri/target/${{ matrix.target }}/release/bundle/macos/TeachersPen.app --report dist/license-macos-${{ matrix.arch }}.json
      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: TeachersPen-macOS-${{ matrix.arch }}-${{ steps.commit.outputs.sha }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows:
    name: Windows x64 · lightweight
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Get short commit ID
        id: commit
        shell: bash
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          architecture: x64
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.91.1
      - name: Cache Rust dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: tauri-${{ runner.os }}-x64-rust191-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: tauri-${{ runner.os }}-x64-rust191-
      - name: Install dependencies
        run: npm ci
      - name: Check dependency licenses
        run: npm run licenses:check
      - name: Build NSIS installer with the MSVC environment
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "TEACHERSPEN_VS_PATH=%%i"
          if not defined TEACHERSPEN_VS_PATH exit /b 1
          call "%TEACHERSPEN_VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          call npm run dist:win -- --ci
      - name: Verify Windows installer licenses and sources
        run: npm run licenses:verify -- --bundle-dir src-tauri/target/release/bundle/nsis --report dist/license-windows.json
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: TeachersPen-Windows-x64-${{ steps.commit.outputs.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  linux:
    name: Linux x64 · lightweight
    runs-on: ubuntu-22.04
    # Keep glibc and WebKitGTK at an older baseline than the host runner.
    container: ubuntu:20.04
    timeout-minutes: 45
    env:
      DEBIAN_FRONTEND: noninteractive
      LANG: C.UTF-8
      APPIMAGE_EXTRACT_AND_RUN: '1'
      CARGO_HOME: /opt/rust/cargo
      RUSTUP_HOME: /opt/rust/rustup
      TAURI_BUNDLER_NEW_APPIMAGE_FORMAT: 'true'
    steps:
      - name: Install native build and packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl wget git python3 pkg-config \
            libx11-dev libwebkit2gtk-4.0-dev libgtk-3-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libarchive-tools libfuse2 libcrypt1 libssl1.1 \
            fakeroot file xz-utils unzip zip zstd
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Get short commit ID
        id: commit
        shell: bash
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          architecture: x64
          cache: npm
      - name: Set up Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/teacherspen-rustup.sh
          sh /tmp/teacherspen-rustup.sh -y --profile minimal --default-toolchain 1.91.1
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Cache Rust dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            /opt/rust/cargo/registry
            /opt/rust/cargo/git
            src-tauri/target
          key: tauri-ubuntu2004-x64-rust191-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: tauri-ubuntu2004-x64-rust191-
      - name: Install dependencies
        run: npm ci
      - name: Check dependency licenses
        run: npm run licenses:check
      - name: Build GNOME Shell extension
        run: npm run build:gnome
      - name: Build AppImage and DEB
        run: npm run dist:linux -- --ci --verbose
      - name: Verify Linux installer licenses and sources
        run: npm run licenses:verify -- --bundle-dir src-tauri/target/release/bundle --gnome dist/gnome/teacherspen@pgilfernandez.github.io.shell-extension.zip --report dist/license-linux.json
      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: TeachersPen-Linux-x64-AppImage-${{ steps.commit.outputs.sha }}
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload Linux DEB
        uses: actions/upload-artifact@v4
        with:
          name: TeachersPen-Linux-x64-DEB-${{ steps.commit.outputs.sha }}
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload GNOME Shell extension
        uses: actions/upload-artifact@v4
        with:
          name: TeachersPen-GNOME-extension-${{ steps.commit.outputs.sha }}
          path: dist/gnome/*.shell-extension.zip
          if-no-files-found: error
          retention-days: 14


  licenses:
    name: All-platform license policy and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.91.1
      - run: npm ci
      - run: npm run check
      - run: npm run licenses:check -- --all-targets
      - run: npm run build:gnome
      - run: npm run licenses:verify -- --gnome dist/gnome/teacherspen@pgilfernandez.github.io.shell-extension.zip --report dist/license-gnome.json
