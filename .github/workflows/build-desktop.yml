name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build DMG
        run: npm run dist:mac -- --${{ matrix.arch }} --publish never
      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: TeachersPen-macOS-${{ matrix.arch }}-${{ github.sha }}
          path: release/*-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          architecture: x64
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build NSIS installer with the MSVC environment
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "TEACHERSPEN_VS_PATH=%%i"
          if not defined TEACHERSPEN_VS_PATH exit /b 1
          call "%TEACHERSPEN_VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          call npm run dist:win -- --x64 --publish never
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: TeachersPen-Windows-x64-${{ github.sha }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    # Compile the native helper against an older glibc, rather than the host's.
    container: ubuntu:20.04
    timeout-minutes: 45
    env:
      DEBIAN_FRONTEND: noninteractive
      LANG: C.UTF-8
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - name: Install native build and packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git python3 \
            libx11-dev libarchive-tools libfuse2 libcrypt1 libssl1.1 \
            fakeroot file xz-utils unzip zip zstd
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          architecture: x64
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build AppImage and DEB
        run: npm run dist:linux -- --x64 --publish never
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: TeachersPen-Linux-x64-${{ github.sha }}
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
